version: '3.8'
services:
  application:
    image: python:3.11
    container_name: application
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    working_dir: /app
    command: >
      bash -c "
        pip install --timeout=600 -r requirements.txt &&
        python manage.py runserver 0.0.0.0:8000
      "