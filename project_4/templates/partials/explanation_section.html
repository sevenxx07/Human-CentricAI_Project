<div class="step-box" id="explanation-section" style="display: none;">
  <h3>How Your Rating Will Affect Future Recommendations</h3>
  <p>See how different ratings for this movie would impact your personalized recommendations:</p>

  <div class="explanation-container">
    <div class="explanation-toggle">
      <button type="submit" id="toggle-explanation-btn" onclick="toggleExplanation()">
        <span id="toggle-explanation-text">Show Detailed Impact</span>
        <span id="toggle-explanation-spinner" class="spinner" style="display:none;"></span>
      </button>
    </div>

    <div id="explanation-content" style="display: none;">
      <div class="explanation-grid" id="explanation-grid">
        <!-- Explanations for different ratings will be populated here -->
      </div>
    </div>
  </div>
</div>
