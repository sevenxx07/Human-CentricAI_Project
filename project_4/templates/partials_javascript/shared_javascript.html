<script>
let currentMovie = null;
let explanationVisible = false;
let sessionCompleted = false; // Track completion status
let sessionState = {
  ratingsGiven: 0,
  initial_movies_count: null
};

window.onSessionStepChange = function(newStep) {
  if (typeof updateExplanationSection === 'function') {
    updateExplanationSection(newStep);
  }
};

function showMessage(message, type = 'success') {
  const container = document.getElementById('messages-container');
  const messageDiv = document.createElement('div');
  messageDiv.className = `alert alert-${type}`;
  messageDiv.style.cssText = `
    padding: 10px 15px;
    margin-bottom: 10px;
    border-radius: 4px;
    background-color: ${type === 'success' ? '#d4edda' : '#f8d7da'};
    border: 1px solid ${type === 'success' ? '#c3e6cb' : '#f5c6cb'};
    color: ${type === 'success' ? '#155724' : '#721c24'};
  `;
  messageDiv.textContent = message;
  container.appendChild(messageDiv);

  setTimeout(() => {
    if (messageDiv.parentNode) {
      messageDiv.parentNode.removeChild(messageDiv);
    }
  }, 5000);
}

function initializeSession() {
  const btnText = document.getElementById('init-btn-text');
  const btnSpinner = document.getElementById('init-btn-spinner');

  btnText.style.display = 'none';
  btnSpinner.style.display = 'inline-block';

  fetch("{% url 'project4:guided' %}", {
    method: 'POST',
    headers: {
      'X-CSRFToken': '{{ csrf_token }}',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      action: 'initialize_session',
      session_id: 'user_session_' + Date.now()
    })
  })
  .then(response => response.json())
  .then(data => {
    btnText.style.display = 'inline';
    btnSpinner.style.display = 'none';

    if (data.error) {
      showMessage(data.error, 'error');
    } else {
      showMessage(data.message);
      updateSessionDisplay(data);
      showInitialRatingPhase(data.movies);

      // Track session completion
      sessionCompleted = (data.session_step === 'complete');

      if (data.session_step && typeof onSessionStepChange === 'function') {
        onSessionStepChange(data.session_step);
      }

      // Show the first movie for rating
      if (data.next_movie) {
        showMovieForRating(data.next_movie, data.session_step);
      }
    }
  })
  .catch(error => {
    btnText.style.display = 'inline';
    btnSpinner.style.display = 'none';
    showMessage('Error initializing session: ' + error, 'error');
  });
}

function showInitialRatingPhase(movies) {
  document.getElementById('init-section').style.display = 'none';
  document.getElementById('initial-rating-section').style.display = 'block';
  document.getElementById('session-controls').style.display = 'block';

  if (movies) {
    displayMoviesGrid(movies);
  }
}

function displayMoviesGrid(movies) {
  const grid = document.getElementById('movie-grid');
  grid.innerHTML = movies.map(movie => `
    <div class="movie-card" id="movie-${movie.movie_id}">
      <div class="movie-title">${movie.title}</div>
      <div class="movie-details">
        ${movie.genres}
      </div>
    </div>
  `).join('');
}

function showMovieForRating(movie, sessionStep = null) {
  currentMovie = movie;
  const card = document.getElementById('current-movie-card');
  const isComplete = sessionStep === 'complete';

  card.innerHTML = `
    <div class="movie-title">${movie.title}</div>
    <div class="movie-details">${movie.genres}</div>
    ${movie.predicted_rating ? `<div class="prediction">Predicted rating: ${movie.predicted_rating.toFixed(1)}</div>` : ''}
    ${isComplete ? '<div class="display-only-notice" style="background-color: #e3f2fd; padding: 8px; border-radius: 4px; margin-top: 10px; color: #1565c0; font-weight: bold;">Final Recommendation - Display Only</div>' : ''}
  `;

  document.getElementById('rating-interface').style.display = 'block';

  // Only show explanation section if it exists and session not complete
  const explanationSection = document.getElementById('explanation-section');
  if (explanationSection) {
    explanationSection.style.display = isComplete ? 'none' : 'block';
  }

  // Handle rating controls based on session completion
  const ratingForm = document.querySelector('.rating-form');
  if (isComplete) {
    // Hide rating controls for completed sessions
    ratingForm.style.display = 'none';
  } else {
    ratingForm.style.display = 'block';
    resetStarRating();
    resetExplanation();
  }
}

function setupStarRating() {
  const stars = document.querySelectorAll('.star');
  stars.forEach(star => {
    star.addEventListener('click', function() {
      // Prevent rating if session is completed
      if (sessionCompleted) {
        showMessage('This movie is for display purposes only. The session is complete.', 'info');
        return;
      }

      const rating = parseFloat(this.dataset.rating);
      document.getElementById('selected-rating').value = rating;
      document.getElementById('submit-rating-btn').disabled = false;

      // Visual feedback - highlight this star and all previous stars
      stars.forEach((s) => {
        const starRating = parseFloat(s.dataset.rating);
        if (starRating <= rating) {
          s.classList.add('active');
          s.parentElement.classList.add('active');
        } else {
          s.classList.remove('active');
          s.parentElement.classList.remove('active');
        }
      });
    });
  });
}

function resetStarRating() {
  document.querySelectorAll('.star').forEach(star => {
    star.classList.remove('active');
  });
  document.getElementById('selected-rating').value = '';
  document.getElementById('submit-rating-btn').disabled = true;
}

function resetExplanation() {
  explanationVisible = false;
  const explanationContent = document.getElementById('explanation-content');
  const explanationText = document.getElementById('toggle-explanation-text');

  if (explanationContent) {
    explanationContent.style.display = 'none';
  }
  if (explanationText) {
    explanationText.textContent = 'Show Detailed Impact';
  }
}

function submitRating() {
  // Prevent submission if session is completed
  if (sessionCompleted) {
    showMessage('This movie is for display purposes only. The session is complete.', 'info');
    return;
  }

  const rating = document.getElementById('selected-rating').value;
  if (!rating || !currentMovie) return;

  fetch("{% url 'project4:guided' %}", {
    method: 'POST',
    headers: {
      'X-CSRFToken': '{{ csrf_token }}',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      action: 'submit_rating',
      movie_id: currentMovie.movie_id,
      rating: parseFloat(rating)
    })
  })
  .then(response => response.json())
  .then(data => {
    if (data.error) {
      showMessage(data.error, 'error');
    } else {
      showMessage(data.message);
      updateSessionDisplay(data);

      // Update completion status
      sessionCompleted = (data.session_step === 'complete');

      if (data.session_step && typeof onSessionStepChange === 'function') {
        onSessionStepChange(data.session_step);
      }

      handleRatingSubmitted(data);
    }
  })
  .catch(error => {
    showMessage('Error submitting rating: ' + error, 'error');
  });
}

function handleRatingSubmitted(data) {
  // Server determines phase transition, just update UI
  if (data.session_step === 'active_learning') {
    document.getElementById('initial-rating-section').style.display = 'none';
    document.getElementById('active-learning-section').style.display = 'block';
  }

  if (data.next_movie) {
    showMovieForRating(data.next_movie, data.session_step);
  } else {
    // No next movie - session complete
    document.getElementById('rating-interface').style.display = 'none';
    const explanationSection = document.getElementById('explanation-section');
    if (explanationSection) {
      explanationSection.style.display = 'none';
    }
    showMessage('Session complete!', 'info');
  }
}

function updateProgress() {
  // Simple progress display based on server data
  const initialCount = sessionState.initial_movies_count || 8;
  const progress = Math.min((sessionState.ratingsGiven / initialCount) * 100, 100);
  document.getElementById('progress-fill').style.width = progress + '%';
  document.getElementById('progress-text').textContent = `${sessionState.ratingsGiven} / ${initialCount} movies rated`;
}

function updateSessionDisplay(data) {
  // Let the server handle most logic, just update UI elements
  if (data.total_ratings !== undefined) {
    document.getElementById('ratings-count').textContent = data.total_ratings;
    sessionState.ratingsGiven = data.total_ratings;
  }
  if (data.session_phase) {
    const phaseText = data.session_phase === 'initial_rating' ? 'Initial Rating' : 'Active Learning';
    document.getElementById('current-phase').textContent = phaseText;
  }
  if (data.initial_movies_count !== undefined) {
    sessionState.initial_movies_count = data.initial_movies_count;
  }

  updateProgress();
}

function resetSession() {
  fetch("{% url 'project4:guided' %}", {
    method: 'POST',
    headers: {
      'X-CSRFToken': '{{ csrf_token }}',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      action: 'reset_session'
    })
  })
  .then(response => response.json())
  .then(data => {
    if (data.error) {
      showMessage(data.error, 'error');
    } else {
      showMessage(data.message);
      location.reload();
    }
  })
  .catch(error => {
    showMessage('Error resetting session: ' + error, 'error');
  });
}

// Initialize page
document.addEventListener('DOMContentLoaded', function() {
  setupStarRating();

  {% if session_active %}
  document.getElementById('session-controls').style.display = 'block';
  {% endif %}
});
</script>
